$('#cvview').onclick = () => { const w = window.open(URL.createObjectURL(cvBlob()), '_blank'); if (!w) $('#cvmsg').textContent = 'Your browser blocked the new tab. Use Download CV instead.'; };
$('#cvdl').onclick = async () => {
  const m = $('#cvmsg');
  try {
    const d = window.claude ? await window.claude.use('downloads') : null;
    if (!d) { m.textContent = 'Saving files is not available in this view. Use View CV and save from the PDF viewer.'; return; }
    await d.save({ filename: 'Rifazul_Karim_Rahat_CV.pdf', data: cvBlob() });
    m.textContent = 'CV saved.';
  } catch (e) { m.textContent = e && e.code === 'declined' ? 'Download cancelled.' : 'Could not save the CV. Try View CV instead.'; }
};

/* Project details */
const dlg = $('#dlg');
$('#projects').addEventListener('click', e => {
  const b = e.target.closest('[data-i]'); if (!b) return;
  const p = D.projects[b.dataset.i];
  dlg.innerHTML = `<span class="meta">${esc(p.cat)}</span><h3 style="font-size:1.6rem">${esc(p.title)}</h3><h4>Overview</h4><p>${esc(p.desc)}</p>
  <h4>Technologies</h4><div>${tags(p.tech)}</div>
  ${p.features ? `<h4>Features</h4><ul>${p.features.map(f => `<li>${esc(f)}</li>`).join('')}</ul>` : ''}
  <h4>My contribution</h4><p>${esc(p.role)}</p>
  <div class="row">${link(p.github, 'GitHub')}${link(p.live, 'Live demo')}${link(p.pdf, 'Project PDF')}<button class="btn" id="x">Close</button></div>
  ${p.pdf ? `<iframe loading="lazy" src="${esc(p.pdf)}" title="${esc(p.title)} PDF"></iframe>` : ''}`;
  dlg.showModal(); $('#x').onclick = () => dlg.close();
});
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });

/* Contact form: opens the visitor's email app; nothing is sent from this page */
$('#cf').addEventListener('submit', e => {
  e.preventDefault();
  const f = new FormData(e.target), v = k => String(f.get(k)).trim();
  const err = !v('name') ? 'Enter your name.' : !/^\S+@\S+\.\S+$/.test(v('email')) ? 'Enter a valid email address.' : !v('subject') ? 'Enter a subject.' : v('message').length < 10 ? 'Write a message of at least 10 characters.' : '';
  $('#st').textContent = err || 'Opening your email app. The message is sent only when you send it from there.';
  if (!err) location.href = `mailto:${P.email}?subject=${encodeURIComponent(v('subject'))}&body=${encodeURIComponent(v('message') + '\n\n' + v('name') + ' (' + v('email') + ')')}`;
});

/* Theme and menu */
const root = document.documentElement;
try { const t = localStorage.getItem('theme'); if (t) root.dataset.theme = t; } catch (e) {}
$('#theme').onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('theme', root.dataset.theme); } catch (e) {}
};
$('#burger').onclick = () => { const o = $('#menu').classList.toggle('open'); $('#burger').setAttribute('aria-expanded', o); };
$('#menu').onclick = e => { if (e.target.tagName === 'A') { $('#menu').classList.remove('open'); $('#burger').setAttribute('aria-expanded', false); } };
const links = [...document.querySelectorAll('#menu a')];
const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) links.forEach(a => a.classList.toggle('on', a.hash === '#' + en.target.id)); }), { rootMargin: '-35% 0px -60% 0px' });
document.querySelectorAll('main section').forEach(s => io.observe(s));
</script>
